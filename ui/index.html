<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cove</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2326215C'/><path d='M44.02 19.98A17 17 0 1 0 44.02 44.02' fill='none' stroke='%237F77DD' stroke-width='10' stroke-linecap='round'/><path d='M26 32q4.5-6 9 0t9 0 9 0' fill='none' stroke='%23EEEDFE' stroke-width='7' stroke-linecap='round'/></svg>">
<style>
:root {
  --bg: #eef3f2; --bg-2: #e3ecea; --surface: #ffffff; --surface-2: #f5f9f8; --ink: #0f2b2a; --ink-2: #3f5a58; --ink-3: #7c9391;
  --line: #dbe6e4; --sea: #0d9488; --sea-2: #14b8a6; --sea-soft: #d5f2ee; --deep: #0b3b3c;
  --sand: #f6e7c8; --coral: #e85d4a; --amber: #d99a1b; --ok: #10a37f;
  --shadow: 0 1px 2px rgba(15,43,42,.05), 0 12px 32px -18px rgba(15,60,58,.28);
  --r: 18px; --mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0a1615; --bg-2: #0f1e1d; --surface: #11211f; --surface-2: #162a28; --ink: #e2efed; --ink-2: #a9c1be; --ink-3: #6d8885;
    --line: #1f3533; --sea-soft: rgba(20,184,166,.14); --sand: #3a3220; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 34px -18px rgba(0,0,0,.6); color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
/* Slim scrollbars that sit on the page instead of a grey system gutter. */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--ink-3) 40%, transparent); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--ink-3) 70%, transparent); }
::-webkit-scrollbar-button { display: none; }
.term ::-webkit-scrollbar-thumb, .console::-webkit-scrollbar-thumb { background-color: rgba(143,179,174,.3); }
a { color: var(--sea); text-decoration: none; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--sea-soft); color: var(--deep); padding: 1px 7px; border-radius: 6px; }
@media (prefers-color-scheme: dark) { code { color: #9ff0e3; } }

/* top bar */
.bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1180px; margin: 0 auto; padding: 0 28px; height: 64px; display: flex; align-items: center; gap: 28px; }
.brand { display: flex; align-items: center; gap: 10px; font: 650 18px/1 "Segoe UI Variable Display", "Segoe UI", system-ui; letter-spacing: -.02em; color: var(--ink); }
.brand svg { width: 30px; height: 30px; }
.tabs { display: flex; gap: 2px; background: var(--bg-2); padding: 4px; border-radius: 999px; }
.tabs a { padding: 6px 15px; border-radius: 999px; color: var(--ink-2); font-weight: 550; font-size: 13.5px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(15,43,42,.12); }
.tabs .badge { background: var(--coral); color: #fff; font-size: 10.5px; padding: 0 6px; border-radius: 999px; font-weight: 700; }
.bar .health { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); }
.pulse.ok { background: var(--ok); box-shadow: 0 0 0 0 rgba(16,163,127,.5); animation: ring 2s infinite; }
.pulse.part { background: var(--amber); }
@keyframes ring { 70% { box-shadow: 0 0 0 7px rgba(16,163,127,0); } 100% { box-shadow: 0 0 0 0 rgba(16,163,127,0); } }

.wrap { max-width: 1180px; margin: 0 auto; padding: 30px 28px 70px; }
.title { display: flex; align-items: flex-end; gap: 14px; margin: 4px 0 22px; flex-wrap: wrap; }
.title h1 { margin: 0; font: 650 30px/1.1 "Segoe UI Variable Display", "Segoe UI", system-ui; letter-spacing: -.03em; }
.title p { margin: 6px 0 0; color: var(--ink-2); }
.title .sp { flex: 1; }

.btn { border: 0; background: var(--surface); color: var(--ink); padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 13.5px; box-shadow: inset 0 0 0 1px var(--line); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: .15s; }
.btn:hover { box-shadow: inset 0 0 0 1px var(--sea-2); color: var(--sea); }
.btn.fill { background: var(--deep); color: #fff; box-shadow: none; }
.btn.fill:hover { background: var(--sea); color: #fff; }
.btn.sea { background: var(--sea); color: #fff; box-shadow: none; }
.btn.sea:hover { background: var(--sea-2); color: #fff; }
.btn.sm { padding: 5px 12px; font-size: 12.5px; }
.btn.plain { background: transparent; box-shadow: none; color: var(--ink-2); }
.btn.plain:hover { background: var(--surface-2); color: var(--ink); }
.btn.warn:hover { color: var(--coral); box-shadow: inset 0 0 0 1px var(--coral); }
input[type=text], select { background: var(--surface); border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 999px; padding: 8px 16px; outline: none; }
input[type=text]:focus, select:focus { box-shadow: inset 0 0 0 2px var(--sea-2); }
select { padding: 6px 12px; border-radius: 10px; }

.panel { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 34px 0 12px; }

/* hero */
.hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; }
.hero-main { background: linear-gradient(135deg, #0b3b3c 0%, #0d6e78 55%, #14b8a6 130%); color: #e9fbf8; border-radius: 24px; padding: 28px 30px; position: relative; overflow: hidden; box-shadow: var(--shadow); }
.hero-main::after { content: ""; position: absolute; inset: auto -10% -40% -10%; height: 70%; background: radial-gradient(60% 60% at 50% 100%, rgba(255,255,255,.14), transparent 70%); }
.hero-main svg.waves { position: absolute; right: -10px; bottom: -6px; width: 320px; opacity: .18; }
.hero-main h2 { margin: 0; font: 650 40px/1 "Segoe UI Variable Display", "Segoe UI", system-ui; letter-spacing: -.03em; }
.hero-main p { margin: 10px 0 22px; color: #bfeee6; max-width: 420px; }
.hero-main .acts { display: flex; gap: 8px; position: relative; z-index: 1; flex-wrap: wrap; }
.hero-main .btn { background: rgba(255,255,255,.14); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
.hero-main .btn:hover { background: rgba(255,255,255,.24); }
.hero-main .btn.light { background: #fff; color: var(--deep); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.fact { padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between; }
.fact b { font: 650 28px/1.1 "Segoe UI Variable Display", "Segoe UI", system-ui; letter-spacing: -.02em; }
.fact span { color: var(--ink-2); font-size: 13px; }
.fact .ic { width: 34px; height: 34px; border-radius: 11px; background: var(--sea-soft); color: var(--sea); display: grid; place-items: center; margin-bottom: 12px; }
.fact .ic svg { width: 18px; height: 18px; }

/* services as rows */
.svc-list .svc { display: grid; grid-template-columns: 44px minmax(140px, 220px) 1fr 230px 48px; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.svc-list .svc:last-child { border-bottom: 0; }
.svc .glyph { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); font: 700 13px var(--mono); color: var(--ink-2); }
.svc.running .glyph { background: var(--sea-soft); color: var(--sea); }
.svc .nm { font-weight: 650; }
.svc .ver { color: var(--ink-3); font-size: 12.5px; }
.svc .desc { color: var(--ink-2); font-size: 13px; }
.svc .err { color: var(--coral); font-size: 12.5px; grid-column: 2 / -1; margin-top: -6px; }
.state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-3); text-transform: capitalize; }
.state.running { background: rgba(16,163,127,.12); color: var(--ok); }
.state.error { background: rgba(232,93,74,.12); color: var(--coral); }
.state.starting { background: rgba(217,154,27,.14); color: var(--amber); }
.switch { width: 44px; height: 26px; border-radius: 999px; border: 0; background: var(--line); position: relative; cursor: pointer; transition: .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: .2s; }
.switch.on { background: var(--sea); }
.switch.on::after { left: 21px; }

/* site tiles */
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.tile { padding: 18px; display: flex; flex-direction: column; gap: 12px; transition: transform .15s; }
.tile:hover { transform: translateY(-2px); }
.tile .top { display: flex; gap: 12px; align-items: center; }
.avatar { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font: 700 17px "Segoe UI Variable Display", system-ui; color: #fff; flex: none; text-transform: uppercase; }
.tile .host { font-weight: 650; font-size: 15px; color: var(--ink); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .host:hover { color: var(--sea); }
.tile .path { color: var(--ink-3); font: 11.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.chip.lv { background: #fde8e4; color: #c2412d; }
.chip.wp { background: #e3ecfb; color: #2b5cb8; }
.chip.tls { background: rgba(16,163,127,.12); color: var(--ok); }
@media (prefers-color-scheme: dark) { .chip.lv { background: rgba(232,93,74,.15); color: #ff9c8c; } .chip.wp { background: rgba(80,130,230,.15); color: #9dbbf5; } }
.tile .foot { display: flex; gap: 6px; align-items: center; border-top: 1px dashed var(--line); padding-top: 12px; }
.tile .foot select { flex: 1; min-width: 0; }
.empty { padding: 56px 20px; text-align: center; color: var(--ink-2); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }

/* php */
.php-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.php-card { padding: 20px; display: flex; flex-direction: column; gap: 10px; position: relative; }
.php-card.def { box-shadow: inset 0 0 0 2px var(--sea), var(--shadow); }
.php-card .big { font: 650 34px/1 "Segoe UI Variable Display", system-ui; letter-spacing: -.03em; }
.php-card .tag { position: absolute; top: 16px; right: 16px; }
.php-card .acts { display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap; }
.rows .row { display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid var(--line); }
.rows .row:last-child { border-bottom: 0; }
.rows .grow { flex: 1; min-width: 0; }
.hint { color: var(--ink-2); font-size: 13px; }

/* table */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--ink-3); font-weight: 600; padding: 12px 20px; border-bottom: 1px solid var(--line); }
td { padding: 13px 20px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }

/* mail */
.mail { display: grid; grid-template-columns: 330px 1fr; gap: 18px; height: calc(100vh - 210px); min-height: 420px; }
.inbox { overflow: auto; padding: 8px; }
.msg { padding: 12px 14px; border-radius: 12px; cursor: pointer; margin-bottom: 2px; }
.msg:hover { background: var(--surface-2); }
.msg.on { background: var(--sea-soft); }
.msg .s { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg.new .s::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); margin-left: 8px; vertical-align: middle; }
.msg .f { color: var(--ink-3); font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px; }
.reader { display: flex; flex-direction: column; overflow: hidden; }
.reader header { padding: 18px 22px; border-bottom: 1px solid var(--line); }
.reader h3 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.01em; }
.reader .who { color: var(--ink-2); font-size: 13px; }
.seg { display: inline-flex; background: var(--bg-2); border-radius: 999px; padding: 3px; margin-top: 12px; }
.seg button { border: 0; background: none; padding: 4px 13px; border-radius: 999px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.reader iframe { flex: 1; border: 0; width: 100%; background: #fff; border-radius: 0 0 var(--r) var(--r); }
.reader pre { flex: 1; margin: 0; padding: 20px 22px; overflow: auto; white-space: pre-wrap; font: 12.5px/1.6 var(--mono); }

/* logs */
.logs { display: grid; grid-template-columns: 210px 1fr; gap: 18px; height: calc(100vh - 210px); min-height: 420px; }
.log-names { padding: 8px; overflow: auto; }
.log-names a { display: block; padding: 8px 12px; border-radius: 10px; color: var(--ink-2); font: 12.5px var(--mono); }
.log-names a:hover { background: var(--surface-2); color: var(--ink); }
.log-names a.on { background: var(--sea-soft); color: var(--sea); font-weight: 600; }
.term { background: #071413; border-radius: var(--r); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); }
.term-bar { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #12302d; color: #8fb3ae; font: 12.5px var(--mono); }
.term-bar .dots { display: flex; gap: 6px; }
.term-bar .dots i { width: 11px; height: 11px; border-radius: 50%; background: #1d3b38; display: block; }
.term-bar .dots i:first-child { background: #2dd4bf; }
.term-bar input { flex: 1; background: #0d2220; color: #d6ece8; box-shadow: none; padding: 5px 12px; font-size: 12.5px; }
.term-bar .btn { background: #0d2220; color: #8fb3ae; box-shadow: none; }
#logText { flex: 1; margin: 0; padding: 14px 18px; overflow: auto; color: #c9dfdb; font: 12px/1.65 var(--mono); white-space: pre-wrap; word-break: break-all; }
#logText .e { color: #ff8a7a; }
#logText .w { color: #f3c969; }
.live { color: #2dd4bf; display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #2dd4bf; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .3; } }

.console { background: #071413; color: #c9dfdb; font: 12px/1.6 var(--mono); padding: 16px 18px; border-radius: var(--r); max-height: 260px; overflow: auto; white-space: pre-wrap; margin-top: 16px; display: none; }
.kv { display: grid; grid-template-columns: 200px 1fr; }
.kv > div { padding: 13px 20px; border-bottom: 1px solid var(--line); }
.kv > div:nth-child(odd) { color: var(--ink-3); font-weight: 600; font-size: 13px; }
.kv > div:nth-last-child(-n+2) { border-bottom: 0; }

.toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 20; align-items: center; }
.toasts div { background: var(--deep); color: #e9fbf8; padding: 10px 18px; border-radius: 999px; font-weight: 550; box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); animation: rise .25s ease; max-width: 90vw; }
.toasts div.bad { background: var(--coral); }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } }
.offline { position: fixed; inset: 0; background: rgba(10,22,21,.55); backdrop-filter: blur(6px); display: none; place-items: center; z-index: 30; }
.offline .panel { padding: 30px 34px; max-width: 400px; text-align: center; }

@media (max-width: 900px) {
  .bar-in { gap: 12px; padding: 0 16px; overflow-x: auto; }
  .bar .health { display: none; }
  .wrap { padding: 20px 16px 60px; }
  .hero, .mail, .logs { grid-template-columns: 1fr; height: auto; }
  .svc-list .svc { grid-template-columns: 40px 1fr auto; }
  .svc .desc, .svc .acts { display: none; }
  .kv { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#26215C"/><path d="M44.02 19.98A17 17 0 1 0 44.02 44.02" fill="none" stroke="#7F77DD" stroke-width="8" stroke-linecap="round"/><path d="M25 28.5q3.25-3.5 6.5 0t6.5 0 6.5 0 6.5 0" fill="none" stroke="#EEEDFE" stroke-width="4.5" stroke-linecap="round"/><path d="M27 37.5q3.25-3.5 6.5 0t6.5 0" fill="none" stroke="#AFA9EC" stroke-width="4.5" stroke-linecap="round"/></svg>Cove</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="health" id="health"></div>
</div></header>
<main class="wrap" id="view"></main>
<div class="toasts" id="toasts"></div>
<div class="offline" id="offline"><div class="panel"><h3 style="margin-top:0">Cove isn't running</h3><p class="hint">Start it from the Start menu or run <code>cove up</code>. This page reconnects by itself.</p></div></div>

<script>
const TABS = [['home','Home'],['sites','Sites'],['php','PHP'],['db','Databases'],['mail','Mail'],['logs','Logs'],['settings','Settings']];
const ICON = {
  sites: '<path d="M4 5h16v3H4zm0 5h16v9H4zm3 3v3h4v-3z"/>',
  php: '<path d="M8 4 2 12l6 8h2.6l-6-8 6-8zm8 0h-2.6l6 8-6 8H16l6-8z"/>',
  mail: '<path d="M3 5h18v14H3zm2 2v.5l7 4.5 7-4.5V7l-7 4.5z"/>',
  layers: '<path d="M12 3 2 8l10 5 10-5zm-7.6 8.2L2 12.4 12 17.4l10-5-2.4-1.2L12 15z"/>',
};
let status = null, route = 'home', arg = '', logES = null, mailSel = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const js = s => esc(String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
const svg = n => `<svg viewBox="0 0 24 24" fill="currentColor">${ICON[n]}</svg>`;

async function api(path, o = {}) {
  const r = await fetch(path, { ...o, headers: { 'X-Cove': '1', 'Content-Type': 'application/json' },
    body: o.body && typeof o.body !== 'string' ? JSON.stringify(o.body) : o.body });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
const post = (p, b) => api(p, { method: 'POST', body: b || {} });
function toast(m, bad) { const d = document.createElement('div'); d.className = bad ? 'bad' : ''; d.textContent = m; $('#toasts').append(d); setTimeout(() => d.remove(), bad ? 6000 : 2800); }
async function act(fn, ok) { try { const r = await fn(); if (ok) toast(ok); await refresh(); return r; } catch (e) { toast(e.message, true); } }
const reveal = path => post('/api/open', { path });
// In the Cove.exe window, links that leave the dashboard open in the real browser.
document.addEventListener('click', e => {
  const a = e.target.closest('a[href]');
  if (!a || !window.coveOpenExternal) return;
  const url = new URL(a.href, location.href);
  if (url.host !== location.host && /^https?:$/.test(url.protocol)) { e.preventDefault(); window.coveOpenExternal(url.href); }
});

function chrome() {
  $('#tabs').innerHTML = TABS.map(([id, l]) => `<a href="#${id}" class="${route === id ? 'on' : ''}">${l}${id === 'mail' && status?.mail_unread ? `<span class="badge">${status.mail_unread}</span>` : ''}</a>`).join('');
  if (!status) return;
  const inst = status.services.filter(s => s.installed), up = inst.filter(s => s.state === 'running').length;
  $('#health').innerHTML = `<span class="pulse ${up === inst.length && up ? 'ok' : up ? 'part' : ''}"></span>${up}/${inst.length} running · PHP ${esc(status.default_php || '—')}`;
}
async function refresh() {
  try { status = await api('/api/status'); $('#offline').style.display = 'none'; }
  catch { $('#offline').style.display = 'grid'; return; }
  chrome();
  if (route === 'home') home();
}

// ---------- Home ----------
const GLYPH = { dns: 'DNS', php: 'PHP', nginx: 'NGX', mysql: 'SQL', mail: 'SMTP' };
const DESC = {
  dns: s => `Answers *.${status.tld} with 127.0.0.1`,
  php: s => `FastCGI pools · ${s.version ? 'PHP ' + s.version : 'idle'}`,
  nginx: s => `Ports ${s.port}`,
  mysql: s => `127.0.0.1:${s.port} · root, no password`,

};
const ago = s => !s ? '' : s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm' : Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm';
function home() {
  const s = status, inst = s.services.filter(x => x.installed), up = inst.filter(x => x.state === 'running').length;
  const all = up === inst.length && up > 0;
  $('#view').innerHTML = `
    <section class="hero">

        <a class="panel fact" href="#db"><div class="ic">${svg('layers')}</div><div><b>${s.ports.mysql}</b><br><span>MySQL port</span></div></a>

        <div class="acts" style="display:flex;gap:6px;align-items:center;justify-content:flex-end"><span class="state ${x.state}">${x.state}${x.state === 'running' && x.uptime ? ' · ' + ago(x.uptime) : ''}</span>
          ${x.installed ? `<button class="btn sm plain" onclick="svc('${x.name}','restart')">Restart</button>` : `<button class="btn sm sea" onclick="install('${x.name}')">Install</button>`}</div>
        ${x.installed ? `<button class="switch ${x.state === 'running' ? 'on' : ''}" aria-label="Toggle ${esc(x.label)}" onclick="svc('${x.name}','${x.state === 'running' ? 'stop' : 'start'}')"></button>` : '<span></span>'}

      <div>Parked folders</div><div>${s.paths.map(p => `<a href="#" class="mono" onclick="reveal('${js(p)}');return false">${esc(p)}</a>`).join('<br>')}</div>

async function svc(name, action) {
  await act(() => post(`/api/services/${name}/${action}`), `${name === 'all' ? 'Everything' : name} ${({start:'started',stop:'stopped',restart:'restarted'})[action]}`);
  setTimeout(refresh, 900);
}
async function install(what, branch) {
  const box = $('#console'); if (box) { box.style.display = 'block'; box.textContent = ''; }
  try {
    const r = await fetch('/api/install', { method: 'POST', headers: { 'X-Cove': '1' }, body: JSON.stringify({ what, branch: branch || '' }) });
    const rd = r.body.getReader(), dec = new TextDecoder();
    for (;;) { const { value, done } = await rd.read(); if (done) break; if (box) { box.textContent += dec.decode(value); box.scrollTop = box.scrollHeight; } }
    toast(`${what} ${branch || ''} ready`);
  } catch (e) { toast(e.message, true); }
  await refresh(); if (route === 'php') php();
}

// ---------- Sites ----------
const HUES = ['#0d9488','#2563eb','#c026d3','#ea580c','#16a34a','#7c3aed','#db2777','#0891b2','#ca8a04','#4f46e5'];
const hue = s => HUES[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % HUES.length];
async function sites() {
  const list = await api('/api/sites'), vers = status.php.map(p => p.branch);
  $('#view').innerHTML = `
    <div class="title"><div><h1>Sites</h1><p>Every folder in a parked directory is served at <code>folder.${esc(status.tld)}</code>.</p></div><div class="sp"></div>
      <input type="text" id="q" placeholder="Search sites" oninput="filt()" style="width:200px"></div>
    <div class="tools panel" style="padding:12px">

      <input type="text" id="ln" placeholder="name (optional)" style="flex:1;min-width:130px">
      <button class="btn" onclick="park()">Park folder</button><button class="btn fill" onclick="link()">Link site</button>
    </div>
    ${list.length ? `<div class="tiles">${list.map(s => `
      <div class="panel tile" data-n="${esc(s.name)}">
        <div class="top"><div class="avatar" style="background:${hue(s.name)}">${esc(s.name[0])}</div>
          <div style="min-width:0"><a class="host" href="${esc(s.url)}" target="_blank">${esc(s.host)}</a><div class="path" title="${esc(s.path)}">${esc(s.path)}</div></div></div>
        <div class="meta"><span class="chip ${s.framework === 'Laravel' ? 'lv' : s.framework === 'WordPress' ? 'wp' : ''}">${esc(s.framework)}</span>
          ${s.secure ? '<span class="chip tls">HTTPS</span>' : ''}${s.linked ? '<span class="chip">linked</span>' : ''}${s.isolated ? `<span class="chip">pinned ${esc(s.php)}</span>` : ''}</div>
        <div class="foot">
          <select title="PHP version" onchange="iso('${s.name}',this.value)"><option value="">PHP ${esc(status.default_php)} (default)</option>${vers.map(v => `<option value="${v}" ${s.isolated && s.php === v ? 'selected' : ''}>PHP ${v}</option>`).join('')}</select>
          <button class="btn sm plain" title="${s.secure ? 'Turn HTTPS off' : 'Turn HTTPS on'}" onclick="sec('${s.name}',${!s.secure})">${s.secure ? 'HTTP' : 'HTTPS'}</button>
          <button class="btn sm plain" onclick="post('/api/sites/reveal',{name:'${s.name}'})">Folder</button>

        </div>
      </div>`).join('')}</div>` : `<div class="panel empty"><b>No sites yet</b>Create a folder in <code>${esc(status.paths[0] || '')}</code> or link a project above.</div>`}
    <div class="label">Parked folders</div>
    <div class="panel rows">${status.paths.map(p => `<div class="row"><span class="grow mono">${esc(p)}</span>
      <button class="btn sm plain" onclick="reveal('${js(p)}')">Open</button><button class="btn sm plain warn" onclick="unpark('${js(p)}')">Remove</button></div>`).join('') || '<div class="empty">None</div>'}</div>`;
}
function filt() { const q = $('#q').value.toLowerCase(); document.querySelectorAll('.tile').forEach(t => t.style.display = t.dataset.n.includes(q) ? '' : 'none'); }
const sec = (name, on) => act(() => post('/api/sites/secure', { name, secure: on }), on ? `${name} now uses HTTPS` : `${name} now uses HTTP`).then(sites);
const iso = (name, php) => act(() => post('/api/sites/isolate', { name, php }), php ? `${name} pinned to PHP ${php}` : `${name} follows the default PHP`).then(sites);
const unl = name => act(() => post('/api/sites/unlink', { name }), `${name} unlinked`).then(sites);
const link = () => act(() => post('/api/sites/link', { path: $('#lp').value.trim(), name: $('#ln').value.trim() }), 'Site linked').then(sites);
const park = () => act(() => post('/api/paths', { path: $('#lp').value.trim() }), 'Folder parked').then(sites);
const unpark = path => act(() => post('/api/paths', { path, remove: true }), 'Folder removed').then(sites);

// ---------- PHP ----------
async function php() {
  $('#view').innerHTML = `<div class="title"><div><h1>PHP</h1><p>Versions live side by side. Set the default, or pin a site from the Sites tab.</p></div></div>
    <div class="php-grid" id="have"></div><div class="console" id="console"></div>
    <div class="label">Available from windows.php.net</div><div class="panel rows" id="avail"><div class="empty">Checking releases…</div></div>

      <div>Extensions</div><div class="hint">curl, fileinfo, gd, intl, mbstring, exif, openssl, pdo_mysql, pdo_sqlite, pdo_pgsql, sodium, zip, bz2, gmp, sockets, opcache + JIT</div></div>`;
  $('#have').innerHTML = status.php.length ? status.php.slice().reverse().map(p => `
    <div class="panel php-card ${p.default ? 'def' : ''}">${p.default ? '<span class="chip tls tag">default</span>' : ''}
      <div class="big">${p.branch}</div><div class="hint">PHP ${esc(p.version)} · NTS x64</div>
      <div class="acts">${p.default ? '' : `<button class="btn sm fill" onclick="act(()=>post('/api/php/default',{branch:'${p.branch}'}),'Default PHP is now ${p.branch}').then(php)">Make default</button>`}
        <button class="btn sm" onclick="install('php','${p.branch}')">Update</button>

    $('#avail').innerHTML = av.map(r => { const v = r.version.replace(/-\d+$/, ''); return `<div class="row"><b style="width:46px">${r.branch}</b><span class="grow">PHP ${esc(v)} <span class="hint">· ${esc(r.size)}</span></span>
      ${have[r.branch] ? (have[r.branch] === v ? '<span class="chip">installed</span>' : `<button class="btn sm sea" onclick="install('php','${r.branch}')">Update to ${esc(v)}</button>`) : `<button class="btn sm fill" onclick="install('php','${r.branch}')">Install</button>`}</div>`; }).join('');
  } catch (e) { $('#avail').innerHTML = `<div class="empty">Couldn't reach windows.php.net: ${esc(e.message)}</div>`; }
}

// ---------- Mail ----------
async function mail() {
  const list = await api('/api/mail');
  $('#view').innerHTML = `<div class="title"><div><h1>Mail</h1><p>Anything sent to <code>127.0.0.1:${status.ports.smtp}</code> is caught here, nothing leaves your machine.</p></div><div class="sp"></div>
    ${list.length ? '<button class="btn warn" onclick="clr()">Empty inbox</button>' : ''}</div>
    <div class="mail"><div class="panel inbox">${list.map(m => `
      <div class="msg ${m.read ? '' : 'new'} ${mailSel === m.id ? 'on' : ''}" data-id="${m.id}" onclick="openMail('${m.id}')">
        <div class="s">${esc(m.subject)}</div><div class="f"><span>${esc(m.from)}</span><span>${new Date(m.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></div></div>`).join('')
      || `<div class="empty"><b>Inbox empty</b>Point MAIL_HOST / MAIL_PORT at Cove.</div>`}</div>
      <div class="panel reader" id="rd"><div class="empty">Pick a message</div></div></div>`;
  if (mailSel) openMail(mailSel, true);
}
async function openMail(id, quiet) {
  mailSel = id; document.querySelectorAll('.msg').forEach(e => e.classList.toggle('on', e.dataset.id === id));
  let m; try { m = await api('/api/mail/' + id); } catch { return; }
  window._m = m;
  $('#rd').innerHTML = `<header><h3>${esc(m.subject)}</h3><div class="who">${esc(m.from)} → ${esc((m.to || []).join(', '))} · ${new Date(m.date).toLocaleString()}</div>
    ${m.attachments?.length ? `<div class="who">Attachments: ${m.attachments.map(esc).join(', ')}</div>` : ''}
    <div style="display:flex;align-items:center;gap:8px"><div class="seg" id="seg">${m.html ? '<button data-t="0">Preview</button>' : ''}<button data-t="1">Text</button><button data-t="2">Headers</button></div>
    <span style="flex:1"></span><button class="btn sm plain warn" style="margin-top:12px" onclick="del('${id}')">Delete</button></div></header><div id="mb" style="flex:1;display:flex;overflow:hidden"></div>`;
  $('#seg').onclick = e => e.target.dataset.t && tab(+e.target.dataset.t);
  tab(m.html ? 0 : 1); if (!quiet) refresh();
}
function tab(i) {
  const m = window._m, b = $('#mb');
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', +x.dataset.t === i));
  if (i === 0) { b.innerHTML = '<iframe sandbox></iframe>'; b.firstChild.srcdoc = m.html; }
  else if (i === 1) b.innerHTML = `<pre>${esc(m.text || '(no plain-text part)')}</pre>`;
  else b.innerHTML = `<pre>${esc(Object.entries(m.headers || {}).map(([k, v]) => k + ': ' + v).join('\n'))}</pre>`;
}
const del = id => { mailSel = null; act(() => api('/api/mail/' + id, { method: 'DELETE' })).then(mail); };
const clr = () => { mailSel = null; act(() => api('/api/mail', { method: 'DELETE' }), 'Inbox emptied').then(mail); };

// ---------- Logs ----------
async function logs() {
  const names = await api('/api/logs'), cur = arg || names.find(n => n === 'nginx-error') || names[0];
  $('#view').innerHTML = `<div class="title"><div><h1>Logs</h1><p>Every service, tailed live.</p></div></div>
    <div class="logs"><div class="panel log-names">${names.map(n => `<a href="#logs/${n}" class="${n === cur ? 'on' : ''}">${n}</a>`).join('') || '<div class="empty">No logs yet</div>'}</div>
    <div class="term"><div class="term-bar"><span class="dots"><i></i><i></i><i></i></span><span class="live">${esc(cur || '')}.log</span>
      <input type="text" id="lf" placeholder="filter…" oninput="paint()"><button class="btn sm" onclick="wipe('${esc(cur)}')">Clear</button></div><pre id="logText"></pre></div></div>`;
  if (!cur) return;
  window._log = (await api('/api/logs/' + cur)).text; paint(true);
  logES?.close(); logES = new EventSource(`/api/logs/${cur}/stream`);
  logES.onmessage = e => { window._log += JSON.parse(e.data); if (window._log.length > 600000) window._log = window._log.slice(-400000); paint(true); };
}
function paint(stick) {
  const el = $('#logText'); if (!el) return;
  const bottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40, q = ($('#lf')?.value || '').toLowerCase();
  let lines = window._log.split('\n'); if (q) lines = lines.filter(l => l.toLowerCase().includes(q));
  el.innerHTML = lines.slice(-3000).map(l => { const x = l.toLowerCase(), c = /fatal|\[error\]|\[emerg\]|\[crit\]| 50\d /.test(x) ? 'e' : /warn|deprecated| 404 /.test(x) ? 'w' : ''; return c ? `<span class="${c}">${esc(l)}</span>` : esc(l); }).join('\n');
  if (stick !== true || bottom) el.scrollTop = el.scrollHeight;
}
const wipe = n => api('/api/logs/' + n, { method: 'DELETE' }).then(() => { window._log = ''; paint(); });

// ---------- router ----------
const VIEWS = { home, sites, php, db, mail, logs, settings };
async function go() {
  const [r, ...rest] = (location.hash.slice(1) || 'home').split('/');
  route = VIEWS[r] ? r : 'home'; arg = rest.join('/');
  if (route !== 'logs') { logES?.close(); logES = null; }
  if (!status) await refresh();
  chrome(); if (!status) return;
  try { await VIEWS[route](); } catch (e) { toast(e.message, true); }
}
addEventListener('hashchange', go); go(); setInterval(refresh, 3000);
(function watchMail() {
  const es = new EventSource('/api/mail/stream');
  es.onmessage = e => { toast('New mail: ' + JSON.parse(e.data).subject); refresh(); if (route === 'mail') mail(); };
  es.onerror = () => { es.close(); setTimeout(watchMail, 3000); };
})();
</script>
